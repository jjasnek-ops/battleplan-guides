<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">First operation checklist</title><desc id="desc">A schematic sequence: read the briefing, prepare the army, check supply, issue orders and inspect the result.</desc>
<defs><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#657746" stroke-opacity=".14"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#657746" stroke-width="2"/></marker></defs>
<rect width="1200" height="675" fill="#f4f2e9"/><rect width="1200" height="675" fill="url(#grid)"/>
<g font-family="Arial,sans-serif" fill="#25312a"><text x="65" y="90" font-size="19" letter-spacing="4">BATTLEPLAN / FIELD CHECKLIST</text><text x="65" y="150" font-size="43" font-weight="bold">Before you press forward</text>
<g stroke="#657746" stroke-width="2" fill="none"><rect x="65" y="230" width="240" height="190" rx="8"/><rect x="360" y="230" width="240" height="190" rx="8"/><rect x="655" y="230" width="240" height="190" rx="8"/><path d="M310 325H345M605 325H640M900 325H1090V490H650" marker-end="url(#arrow)"/></g>
<text x="85" y="272" font-size="17" letter-spacing="2">01 / BRIEFING</text><text x="85" y="324" font-size="26" font-weight="bold">Objective</text><text x="85" y="365" font-size="20">Terrain + time</text>
<text x="380" y="272" font-size="17" letter-spacing="2">02 / FORMATION</text><text x="380" y="324" font-size="26" font-weight="bold">Officer + weight</text><text x="380" y="365" font-size="20">Supporting roles</text>
<text x="675" y="272" font-size="17" letter-spacing="2">03 / EXECUTION</text><text x="675" y="324" font-size="26" font-weight="bold">Supply + task</text><text x="675" y="365" font-size="20">Watch the result</text>
<text x="390" y="500" font-size="25" font-weight="bold">Pause. Inspect. Adjust.</text><text x="65" y="610" font-size="17">Original conceptual illustration / Not an in-game screenshot</text></g></svg>
